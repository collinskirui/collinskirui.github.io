
<h2 style="text-align:center;">🎲 Law of Large Numbers Simulation</h2>

<div style="text-align:center; margin-bottom:20px;">
  <label>Success probability (p):
    <input id="pVal" type="number" value="0.3" step="0.05" min="0" max="1">
  </label>
  &nbsp;&nbsp;
  <label>Trials (n):
    <input id="nVal" type="number" value="600" step="50" min="50">
  </label>
  &nbsp;&nbsp;
  <label>Runs (m):
    <input id="mVal" type="number" value="10" step="1" min="1">
  </label>
  &nbsp;&nbsp;
  <button id="runBtn">▶ Run Simulation</button>
</div>

<div id="llnPlot" style="width:100%; max-width:850px; height:400px; margin:auto;"></div>

<h2 style="text-align:center; margin-top:50px; color:white;">📊 Distribution of Sample Means</h2>
<div id="histLLN" style="width:100%; max-width:850px; height:400px; margin:auto;"></div>

<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<script src="{{ '/assets/js/lln.js' | relative_url }}"></script>
