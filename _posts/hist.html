title: "Histogram of Sample Means"
---

<h2 style="text-align:center;">📊 Histogram of Sample Means</h2>
<div id="histContainer" style="width:100%; max-width:850px; height:400px; margin:auto;"></div>

<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<script>
window.addEventListener('load', function() {
  const p = 0.3, n = 600, runs = 1000;
  let sampleMeans = [];

  for(let i=0;i<runs;i++){
    const trials = Array.from({length:n}, ()=>Math.random() < p ? 1 : 0);
    sampleMeans.push(trials.reduce((a,b)=>a+b,0)/n);
  }

  Plotly.newPlot('histContainer', [{
    x: sampleMeans,
    type: 'histogram',
    nbinsx: 30,
    marker: {color:'cyan', line:{color:'black', width:1}},
    opacity:0.9
  }], {
    title:'Histogram of Sample Means (p=0.3, n=600)',
    xaxis:{title:'Sample Mean'},
    yaxis:{title:'Frequency'},
    plot_bgcolor:'#222',
    paper_bgcolor:'#222'
  }, {responsive:true});
});
</script>
