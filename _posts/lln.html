---
layout: default
title: "LLN Simulation"
---

<h2 style="text-align:center;">🎲 Law of Large Numbers Simulation</h2>
<div id="llnContainer" style="width:100%; max-width:850px; height:400px; margin:auto;"></div>

<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<script>
window.addEventListener('load', function() {
  const p = 0.3, n = 600, m = 10;
  let traces = [];

  for (let i=0; i<m; i++) {
    const trials = Array.from({length:n}, ()=>Math.random() < p ? 1 : 0);
    const runningMean = trials.map((_, j) => trials.slice(0,j+1).reduce((a,b)=>a+b,0)/(j+1));
    traces.push({
      y: runningMean,
      type: 'scatter',
      mode: 'lines',
      name: 'Run '+(i+1),
      line: {width:2},
      opacity:0.8
    });
  }

  traces.push({
    y: Array(n).fill(p),
    type: 'scatter',
    mode: 'lines',
    name: 'True Mean',
    line: {dash:'dash', color:'black', width:2}
  });

  Plotly.newPlot('llnContainer', traces, {
    title:'Law of Large Numbers Simulation',
    xaxis:{title:'Number of Trials'},
    yaxis:{title:'Running Mean', range:[0,1]}
  }, {responsive:true});
});
</script>
