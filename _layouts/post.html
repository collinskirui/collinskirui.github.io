---
layout: default
---
<article class="doc">
  <a class="back" href="{{ '/' | relative_url }}">&larr; cd ../</a>
  <h1>{{ page.title }}</h1>
  <div class="tags">
    {% if page.topic %}<span class="tag">#{{ page.topic }}</span>{% endif %}
    {% if page.date %}<span class="tag">{{ page.date | date: "%d %b %Y" }}</span>{% endif %}
    {% if page.repo %}<a class="tag" href="{{ page.repo }}">source</a>{% endif %}
  </div>
  <div class="prose">{{ content }}</div>
</article>
