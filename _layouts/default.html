<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<meta name="theme-color" content="#00ff41">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<header><div class="nav">
  <a class="logo" href="{{ '/' | relative_url }}">&gt;_ {{ site.handle }}</a>
  {% for l in site.nav %}<a class="l" href="{{ l.url | relative_url }}">{{ l.name }}</a>{% endfor %}
</div></header>
<main>{{ content }}</main>
<footer><div class="in"><span>{{ site.title }}</span><span><a href="{{ site.github }}">GitHub</a> · <a href="mailto:{{ site.email }}">{{ site.email }}</a></span></div></footer>
</body>
</html>
