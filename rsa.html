<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSA Visualization</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    body { background:#111; color:#fff; font-family:Arial; text-align:center; padding:30px; }
    h1 { margin-bottom: 20px; }
    #plainHist, #cipherHist { width:90%; max-width:700px; height:400px; margin:40px auto; }
  </style>
</head>
<body>

<h1>RSA Encryption Visualization</h1>
<p>Charts load automatically below:</p>

<div id="plainHist"></div>
<div id="cipherHist"></div>

<script>
const text = `loremipsumissimplydummytextoftheprintingandtypesettingindustryloremipsumhasbeentheindustrysstandarddummytexteversincewhenanunknownprintertookagalleyoftypeandscrambledittomakeatypespecimenbookithassurvivednotonlyfivecenturiesbutalsotheleapintoelectronictypesettingremainingessentiallyunchangeditwaspopularisedinthewiththereleaseofletrasetsheetscontainingloremipsumpassagesandmorerecentlywithdesktoppublishingsoftwarelikealduspmakeringversionsofloremipsum`;
const p=29,q=37,n=p*q,e=7;
const letterToNumber={}; for(let i=0;i<26;i++) letterToNumber[String.fromCharCode(97+i)]=i;

// Plaintext frequencies
const plainFreq=Array(26).fill(0);
for(const c of text) if(c>='a' && c<='z') plainFreq[letterToNumber[c]]++;

// Ciphertext
function modPow(base,exp,mod){let r=1n,b=BigInt(base),m=BigInt(mod),ee=BigInt(exp);while(ee>0n){if(ee%2n===1n) r=(r*b)%m; ee/=2n; b=(b*b)%m;} return Number(r);}
const cipherValues=[]; for(const c of text){if(c>='a'&&c<='z'){const M=letterToNumber[c]; cipherValues.push(modPow(M,e,n));}}

// Bin ciphertext
const numBins=20,minC=Math.min(...cipherValues),maxC=Math.max(...cipherValues);
const binSize=Math.ceil((maxC-minC+1)/numBins),bins=Array(numBins).fill(0);
cipherValues.forEach(C=>{let i=Math.floor((C-minC)/binSize);if(i>=numBins)i=numBins-1;bins[i]++;});
const binLabels=Array.from({length:numBins},(_,i)=>`${minC+i*binSize}–${minC+(i+1)*binSize-1}`);
const letters=Array.from({length:26},(_,i)=>String.fromCharCode(97+i));

// Plot charts
Plotly.newPlot('plainHist',[{x:letters,y:plainFreq,type:'bar',marker:{color:'#1f77b4'}}],
               {title:'Plaintext Letter Frequency',plot_bgcolor:'#222',paper_bgcolor:'#222',font:{color:'white'}});
Plotly.newPlot('cipherHist',[{x:binLabels,y:bins,type:'bar',marker:{color:'#ff7f0e'}}],
               {title:'Ciphertext Distribution (Binned)',plot_bgcolor:'#222',paper_bgcolor:'#222',font:{color:'white'}});
</script>

</body>
</html>
